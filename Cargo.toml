[package]
name = "laquna"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
description = "Byte transform for kryphocron at-rest content opacity. Not encryption."
repository = "https://github.com/skydeval/laquna"
readme = "README.md"
publish = false

[features]
default = ["std", "alloc"]
# `alloc` enables the decode path and `Vec<u8>` returns; `no_std`-compatible.
alloc = ["dep:ruzstd"]
# `std` enables the encode path and implies `alloc`.
std = ["alloc", "dep:zstd"]

[dependencies]
chacha20 = { version = "0.9", default-features = false }
blake3 = { version = "1", default-features = false }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
# Decode-side decompressor: pure-Rust, `no_std` + `alloc`. The `hash` feature
# (no_std-safe) is needed because the decoder verifies the frame content checksum
# manually — the dependency computes the checksum but does not compare it itself.
ruzstd = { version = "0.7", default-features = false, features = ["hash"], optional = true }
# Encode-side compressor; requires std.
zstd = { version = "0.13", optional = true }

[dev-dependencies]
# Used only by the vector generator and conformance suite to (de)serialize
# tests/vectors.json. Not part of the shipped crate.
serde_json = "1"
hex = "0.4"

# The vector generator needs the encode path, so it is std-only.
[[example]]
name = "gen_vectors"
required-features = ["std"]
